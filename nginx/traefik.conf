server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;
    set $web_upstream web:8080;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://$api_upstream/healthz;
        include /etc/nginx/proxy_params.conf;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://$api_upstream/readyz;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://$web_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}
