services:
  api:
    environment:
      WEB_ORIGIN: https://${CANKONIX_PUBLIC_HOST:?set CANKONIX_PUBLIC_HOST}

  edge:
    ports: !override
      - "${CANKONIX_HTTP_PORT:-80}:80"
      - "${CANKONIX_HTTPS_PORT:-443}:443"
    volumes: !override
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755

  prometheus:
    image: prom/prometheus:v3.13.1-distroless
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle=false
    ports:
      - "127.0.0.1:${CANKONIX_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777

secrets:
  tls_certificate:
    file: ${CANKONIX_TLS_CERTIFICATE_FILE:?set CANKONIX_TLS_CERTIFICATE_FILE}
  tls_private_key:
    file: ${CANKONIX_TLS_PRIVATE_KEY_FILE:?set CANKONIX_TLS_PRIVATE_KEY_FILE}

volumes:
  prometheus_data:
