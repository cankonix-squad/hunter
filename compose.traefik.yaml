services:
  api:
    environment:
      WEB_ORIGIN: https://${CANKONIX_PUBLIC_HOST:?set CANKONIX_PUBLIC_HOST}

  edge:
    ports: !reset []
    volumes: !override
      - ./nginx/traefik.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${CANKONIX_TRAEFIK_NETWORK:?set CANKONIX_TRAEFIK_NETWORK}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}.rule=Host(`${CANKONIX_PUBLIC_HOST:?set CANKONIX_PUBLIC_HOST}`)"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}.entrypoints=${CANKONIX_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}.tls=true"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}.tls.certresolver=${CANKONIX_TRAEFIK_CERT_RESOLVER:?set CANKONIX_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.rule=Host(`${CANKONIX_PUBLIC_HOST:?set CANKONIX_PUBLIC_HOST}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.entrypoints=${CANKONIX_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.tls=true"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.tls.certresolver=${CANKONIX_TRAEFIK_CERT_RESOLVER:?set CANKONIX_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.priority=50"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api.middlewares=${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api-rate@docker"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.rule=Host(`${CANKONIX_PUBLIC_HOST:?set CANKONIX_PUBLIC_HOST}`) && Path(`/api/v1/auth/login`)"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.entrypoints=${CANKONIX_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.tls=true"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.tls.certresolver=${CANKONIX_TRAEFIK_CERT_RESOLVER:?set CANKONIX_TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.priority=100"
      - "traefik.http.routers.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login.middlewares=${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login-rate@docker"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api-rate.ratelimit.average=20"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api-rate.ratelimit.burst=40"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-api-rate.ratelimit.period=1s"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login-rate.ratelimit.average=5"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login-rate.ratelimit.burst=3"
      - "traefik.http.middlewares.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}-login-rate.ratelimit.period=1m"
      - "traefik.http.services.${CANKONIX_TRAEFIK_ROUTER_PREFIX:-cankonix}.loadbalancer.server.port=80"
    networks:
      - default
      - traefik_proxy

networks:
  traefik_proxy:
    external: true
    name: ${CANKONIX_TRAEFIK_NETWORK:?set CANKONIX_TRAEFIK_NETWORK}
