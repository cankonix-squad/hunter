openapi: 3.1.0
info:
  title: CANKONIX Opportunity Intelligence API
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200': { description: Process is healthy }
  /readyz:
    get:
      operationId: readiness
      responses:
        '200': { description: Dependencies are ready }
        '503': { description: A required dependency is unavailable }
  /api/v1/system:
    get:
      operationId: getSystem
      responses:
        '200':
          description: Runtime identity
          content:
            application/json:
              schema:
                type: object
                required: [name, version, started_at]
                properties:
                  name: { type: string }
                  version: { type: string }
                  started_at: { type: string, format: date-time }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Access and rotating refresh tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { description: Invalid credentials }
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200':
          description: Rotated refresh token and new access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '401': { description: Invalid, expired, revoked, or reused refresh token }
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '204': { description: Refresh session revoked }
  /api/v1/sources:
    get:
      operationId: listSources
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Source registry with operational health
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Source' }
        '401': { description: Authentication required }
  /api/v1/opportunities:
    get:
      operationId: listOpportunities
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, default: active } }
        - { in: query, name: source_id, schema: { type: string, format: uuid } }
        - { in: query, name: relevance, schema: { type: string, enum: [all, relevant, excluded, needs_review], default: all } }
        - { in: query, name: min_score, description: Minimum total score in basis points, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { in: query, name: needs_review, schema: { type: string, enum: [all, 'true', 'false'], default: all } }
        - { in: query, name: shortlisted, schema: { type: string, enum: [all, 'true', 'false'], default: all } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated canonical opportunity feed; active status excludes closed lifecycle stages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '400': { description: Invalid filter or pagination }
        '401': { description: Authentication required }
  /api/v1/opportunities/review:
    get:
      operationId: listOpportunityReviewQueue
      security: [{ bearerAuth: [] }]
      description: Paginated opportunities whose latest deterministic score requires human review.
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, default: active } }
        - { in: query, name: relevance, schema: { type: string, enum: [all, relevant, excluded, needs_review], default: all } }
        - { in: query, name: min_score, schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Human review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpportunityPage' }
        '401': { description: Authentication required }
  /api/v1/opportunities/{id}:
    get:
      operationId: getOpportunity
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Canonical opportunity detail with official source and full change timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opportunity' }
        '404': { description: Opportunity not found }
        '401': { description: Authentication required }
  /api/v1/saved-views:
    get:
      operationId: listSavedOpportunityViews
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved opportunity filters owned by the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SavedView' } }
        '401': { description: Authentication required }
    post:
      operationId: createSavedOpportunityView
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedView' }
      responses:
        '201': { description: Saved view created }
        '401': { description: Authentication required }
        '422': { description: Invalid filters or duplicate name }
  /api/v1/team:
    get:
      operationId: listActiveTeam
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active users available for assignment }
        '401': { description: Authentication required }
  /api/v1/opportunities/{id}/assignment:
    get:
      operationId: getOpportunityAssignment
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current assignment or null }
        '401': { description: Authentication required }
    patch:
      operationId: updateOpportunityAssignment
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignee_user_id]
              properties:
                assignee_user_id: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: Assignment updated or cleared }
        '403': { description: Workflow role required }
        '404': { description: Opportunity not found }
        '422': { description: Assignee is invalid or inactive }
  /api/v1/opportunities/{id}/comments:
    get:
      operationId: listOpportunityComments
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Chronological internal opportunity discussion }
        '404': { description: Opportunity not found }
    post:
      operationId: createOpportunityComment
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201': { description: Internal comment created }
        '404': { description: Opportunity not found }
        '422': { description: Empty or oversized comment }
  /api/v1/opportunities/{id}/shortlist:
    get:
      operationId: getOpportunityShortlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current shared shortlist state }
        '404': { description: Opportunity not found }
    patch:
      operationId: updateOpportunityShortlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shortlisted]
              properties:
                shortlisted: { type: boolean }
      responses:
        '200': { description: Shared shortlist state updated }
        '404': { description: Opportunity not found }
  /api/v1/opportunities/{id}/decision:
    get:
      operationId: getOpportunityDecision
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current human pursue/pass decision or null }
        '404': { description: Opportunity not found }
    patch:
      operationId: updateOpportunityDecision
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [pursue, pass] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        '200': { description: Human decision recorded }
        '403': { description: Workflow role required }
        '404': { description: Opportunity not found }
        '422': { description: Invalid decision or missing reason }
  /api/v1/opportunities/{id}/next-action:
    get:
      operationId: getOpportunityNextAction
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current next action or null }
        '404': { description: Opportunity not found }
    patch:
      operationId: updateOpportunityNextAction
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, due_at]
              properties:
                action: { type: [string, 'null'], minLength: 3, maxLength: 500 }
                due_at: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: Next action updated or cleared }
        '403': { description: Workflow role required }
        '404': { description: Opportunity not found }
        '422': { description: Action and due date must be provided together }
  /api/v1/opportunities/{id}/readiness:
    get:
      operationId: getOpportunityReadiness
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Versioned readiness checklist and progress }
        '404': { description: Opportunity not found }
    patch:
      operationId: updateOpportunityReadinessItem
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, completed, note]
              properties:
                code: { type: string, enum: [scope_validated, eligibility_confirmed, delivery_capacity, commercial_review, document_plan] }
                completed: { type: boolean }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Readiness item updated and aggregate progress returned }
        '403': { description: Workflow or technical-lead role required }
        '404': { description: Opportunity not found }
        '422': { description: Unknown item or oversized note }
  /api/v1/opportunities/{id}/override:
    get:
      operationId: getOpportunityOverride
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current human recommendation/score override or null }
    patch:
      operationId: updateOpportunityOverride
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recommendation, score_bp, reason, clear]
              properties:
                recommendation: { type: [string, 'null'], enum: [relevant, excluded, needs_review, null] }
                score_bp: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                reason: { type: string, maxLength: 2000 }
                clear: { type: boolean }
      responses:
        '200': { description: Human override updated or cleared }
        '403': { description: Workflow role required }
        '422': { description: Invalid override or missing reason }
  /api/v1/opportunities/{id}/activity:
    get:
      operationId: listOpportunityActivity
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Newest-first auditable workflow activity, capped at 200 events }
        '404': { description: Opportunity not found }
  /api/v1/analytics/pipeline:
    get:
      operationId: getPipelineAnalytics
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current portfolio and decision-pipeline counters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineAnalytics' }
        '401': { description: Authentication required }
  /api/v1/alert-rules:
    get:
      operationId: listAlertRules
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user's alert rules }
    post:
      operationId: createAlertRule
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '201': { description: Alert rule created }
        '422': { description: Invalid rule or filters }
  /api/v1/alert-rules/{id}:
    put:
      operationId: updateAlertRule
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleInput' }
      responses:
        '200': { description: Alert rule updated }
        '404': { description: Alert rule not found for current user }
    delete:
      operationId: deleteAlertRule
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Alert rule deleted }
        '404': { description: Alert rule not found for current user }
  /api/v1/alerts:
    get:
      operationId: listAlerts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Newest 200 matched alert events for current user }
  /api/v1/saved-views/{id}:
    delete:
      operationId: deleteSavedOpportunityView
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Saved view deleted }
        '401': { description: Authentication required }
        '404': { description: Saved view not found or owned by another user }
  /api/v1/admin/sources:
    post:
      operationId: createSource
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSource' }
      responses:
        '201': { description: Source created in disabled state }
        '401': { description: Authentication required }
        '403': { description: Administrator role required }
        '422': { description: Invalid source configuration }
  /api/v1/admin/sources/{id}:
    patch:
      operationId: updateSource
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Source policy and status updated }
        '403': { description: Administrator role required }
        '422': { description: Invalid status or policy }
  /api/v1/admin/source-runs:
    post:
      operationId: queueSourceRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, idempotency_key]
              properties:
                source_id: { type: string, format: uuid }
                idempotency_key: { type: string }
      responses:
        '202': { description: Durable source run queued or existing idempotent run returned }
        '403': { description: Administrator or operator role required }
        '422': { description: Source inactive, circuit open, or invalid input }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshToken:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_at, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { const: Bearer }
        expires_at: { type: string, format: date-time }
        user: { type: object }
    CreateSource:
      type: object
      additionalProperties: false
      required: [name, base_url, adapter_name, adapter_version]
      properties:
        name: { type: string }
        base_url: { type: string, format: uri, pattern: '^https://' }
        timezone: { type: string, default: Asia/Jakarta }
        adapter_name: { type: string }
        adapter_version: { type: string }
        policy: { type: object, additionalProperties: true }
    SavedViewFilters:
      type: object
      additionalProperties: false
      required: [q, status, relevance, review_only]
      properties:
        q: { type: string }
        status: { type: string, enum: [active, all, announced, registration_open, registration_closed, evaluation, awarded, contracted, completed, cancelled] }
        source_id: { type: string, format: uuid }
        relevance: { type: string, enum: [all, relevant, excluded, needs_review] }
        min_score_bp: { type: integer, minimum: 0, maximum: 10000 }
        review_only: { type: boolean }
        shortlisted: { type: string, enum: [all, 'true', 'false'], default: all }
    CreateSavedView:
      type: object
      additionalProperties: false
      required: [name, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        filters: { $ref: '#/components/schemas/SavedViewFilters' }
    SavedView:
      allOf:
        - { $ref: '#/components/schemas/CreateSavedView' }
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Source:
      type: object
      required: [id, name, base_url, timezone, adapter_name, adapter_version, status, policy, health_score, policy_version, consecutive_failures, latest_run_metrics, pending_runs, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_url: { type: string, format: uri }
        timezone: { type: string }
        adapter_name: { type: string }
        adapter_version: { type: string }
        status: { type: string, enum: [active, paused, degraded, disabled] }
        policy: { type: object, additionalProperties: true }
        health_score: { type: integer, minimum: 0, maximum: 100 }
        policy_version: { type: string }
        consecutive_failures: { type: integer, minimum: 0 }
        circuit_open_until: { type: string, format: date-time }
        last_success_at: { type: string, format: date-time }
        last_failure_at: { type: string, format: date-time }
        latest_run_status: { type: string }
        latest_run_metrics: { type: object, additionalProperties: true }
        latest_run_error: { type: string }
        latest_run_at: { type: string, format: date-time }
        lag_seconds: { type: integer, format: int64, minimum: 0 }
        pending_runs: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Opportunity:
      type: object
      required: [id, package_identity, title, agency, procurement_type, lifecycle_status, currency, canonical_url, first_seen_at, last_seen_at, source_id, source_name, version_count]
      properties:
        id: { type: string, format: uuid }
        package_identity: { type: string }
        title: { type: string }
        agency: { type: string }
        procurement_type: { type: string }
        lifecycle_status: { type: string, enum: [announced, registration_open, registration_closed, evaluation, awarded, contracted, completed, cancelled] }
        budget_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        registration_deadline: { type: string, format: date-time }
        canonical_url: { type: string, format: uri }
        source_timestamp: { type: string, format: date-time }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        source_id: { type: string, format: uuid }
        source_name: { type: string }
        version_count: { type: integer, minimum: 1 }
        classification: { $ref: '#/components/schemas/Classification' }
        score: { $ref: '#/components/schemas/Score' }
        history:
          type: array
          items: { $ref: '#/components/schemas/OpportunityVersion' }
    OpportunityVersion:
      type: object
      required: [id, snapshot_id, fingerprint, lifecycle_status, data, changed_fields, observed_at]
      properties:
        id: { type: integer, format: int64 }
        snapshot_id: { type: string, format: uuid }
        fingerprint: { type: string }
        lifecycle_status: { type: string }
        data:
          type: object
          required: [title, agency, procurement_type, lifecycle_status, currency]
          properties:
            title: { type: string }
            agency: { type: string }
            procurement_type: { type: string }
            lifecycle_status: { type: string }
            budget_minor: { type: integer, format: int64 }
            currency: { type: string }
            registration_deadline: { type: string, format: date-time }
        changed_fields:
          type: array
          items: { type: string, enum: [title, agency, procurement_type, lifecycle_status, budget_minor, currency, registration_deadline] }
        observed_at: { type: string, format: date-time }
    Classification:
      type: object
      required: [disposition, confidence_bp, reason_code, explanation, auto_rejected, evidence]
      properties:
        disposition: { type: string, enum: [relevant, excluded, needs_review] }
        category_code: { type: string }
        confidence_bp: { type: integer, minimum: 0, maximum: 10000 }
        reason_code: { type: string }
        explanation: { type: string }
        auto_rejected: { type: boolean, description: True only for an approved deterministic exclusion rule }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/ClassificationEvidence' }
    ClassificationEvidence:
      type: object
      required: [rule_code, kind, keyword, source_field, excerpt]
      properties:
        rule_code: { type: string }
        kind: { type: string, enum: [include, exclude] }
        category_code: { type: string }
        keyword: { type: string }
        source_field: { type: string, enum: [title, procurement_type] }
        excerpt: { type: string }
    Score:
      type: object
      required: [version, total_score_bp, confidence_bp, needs_review, reason_code, explanation, dimensions]
      properties:
        version: { type: string }
        total_score_bp: { type: integer, minimum: 0, maximum: 10000 }
        confidence_bp: { type: integer, minimum: 0, maximum: 10000 }
        needs_review: { type: boolean }
        reason_code: { type: string }
        explanation: { type: string }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/ScoreDimension' }
    ScoreDimension:
      type: object
      required: [code, weight_bp, raw_score_bp, contribution, reason_code, explanation, evidence]
      properties:
        code: { type: string, enum: [capability_fit, value, location, deadline, risk] }
        weight_bp: { type: integer, minimum: 0, maximum: 10000 }
        raw_score_bp: { type: integer, minimum: 0, maximum: 10000 }
        contribution: { type: integer, minimum: 0, maximum: 10000 }
        reason_code: { type: string }
        explanation: { type: string }
        evidence: { type: string }
    OpportunityPage:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Opportunity' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    PipelineAnalytics:
      type: object
      required: [total, active, shortlisted, assigned, pursue, pass, undecided, overdue_actions, actions_due_seven_days]
      properties:
        total: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        shortlisted: { type: integer, minimum: 0 }
        assigned: { type: integer, minimum: 0 }
        pursue: { type: integer, minimum: 0 }
        pass: { type: integer, minimum: 0 }
        undecided: { type: integer, minimum: 0 }
        overdue_actions: { type: integer, minimum: 0 }
        actions_due_seven_days: { type: integer, minimum: 0 }
    AlertRuleInput:
      type: object
      additionalProperties: false
      required: [name, event_types, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean, default: true }
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [opportunity.new, opportunity.material_change] }
        filters:
          type: object
          additionalProperties: false
          required: [relevance]
          properties:
            source_id: { type: string, format: uuid }
            relevance: { type: string, enum: [all, relevant, excluded, needs_review] }
            min_score_bp: { type: integer, minimum: 0, maximum: 10000 }
