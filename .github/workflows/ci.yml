name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go format, test, vet, and dependency verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify dependencies
        run: go mod verify
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Evaluate classification candidate precision
        run: go run ./cmd/evaluate -dataset testdata/classification_golden_v1.json -minimum-precision-bp 8000
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan reachable Go vulnerabilities
        run: govulncheck ./...

  frontend:
    name: Frontend test, build, and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  migrations:
    name: Fresh migrations and API integration contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cankonix_migration_test
          POSTGRES_USER: cankonix
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cankonix -d cankonix_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cankonix:migration-test-only@localhost:5432/cankonix_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify all migrations
        run: ./scripts/check-migrations.sh
      - name: Verify seven-day stability gate query
        run: |
          set +e
          ./scripts/stability-report.sh 2026-08-12 > /tmp/stability-report.txt
          status=$?
          set -e
          test "$status" -eq 2
          grep -q 'status=INCOMPLETE' /tmp/stability-report.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Test API contracts, collector E2E, and pagination load budget
        working-directory: services/api
        run: go test -race -tags=integration ./internal/httpapi
      - name: Drill backup and restore
        run: |
          backup_dir=$(mktemp -d)
          dump_file=$(BACKUP_WRITERS_QUIESCED=true ./scripts/backup-postgres.sh "$backup_dir")
          psql 'postgres://cankonix:migration-test-only@localhost:5432/postgres?sslmode=disable' \
            -X -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cankonix_restore_test'
          RESTORE_DATABASE_URL='postgres://cankonix:migration-test-only@localhost:5432/cankonix_restore_test?sslmode=disable' \
            ./scripts/restore-drill.sh "$dump_file"
          rm -rf "$backup_dir"
  containers:
    name: Compose validation and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Verify production secret boundary
        run: ./scripts/check-production-secrets.sh
      - name: Verify staging TLS configuration
        run: ./scripts/check-staging-config.sh
      - name: Verify UAT and deployment runbooks
        run: ./scripts/check-uat-runbook.sh
      - name: Verify stability gate contract
        run: ./scripts/check-stability-gate.sh
      - name: Verify release preflight contract
        run: ./scripts/check-release-preflight.sh
      - name: Verify monitoring configuration
        run: ./scripts/check-monitoring.sh
      - name: Build application images
        run: docker compose build api collector notifier web
      - name: Scan repository vulnerabilities, misconfiguration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan API runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cankonix-oi-api:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan collector runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cankonix-oi-collector:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan notifier runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cankonix-oi-notifier:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan web runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: cankonix-oi-web:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
