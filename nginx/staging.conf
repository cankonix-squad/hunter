limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;
    set $web_upstream web:8080;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/v1/auth/login {
        limit_req zone=login_per_ip burst=3 nodelay;
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://$api_upstream/healthz;
        include /etc/nginx/proxy_params.conf;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://$api_upstream/readyz;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://$web_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}
